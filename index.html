<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BHC 2026">
<title>Binho House Cup 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FBBF24; --gold-dim:#92400E; --gold-faint:#78350F;
  --bg:#0a0a0a; --bg2:#111; --bg3:#181818;
  --border:#252525; --text:#fff; --dim:#6b7280; --mid:#9ca3af;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;
  background-image:radial-gradient(ellipse at top,#1c1008 0%,#0a0a0a 55%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 12px);
}

/* ── HEADER ── */
.hdr{padding:1.75rem 1rem 1rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.hdr-fire{font-size:2.2rem;line-height:1}
.hdr-title{font-family:'Bebas Neue',cursive;font-size:2.6rem;letter-spacing:.06em;color:var(--gold);
  text-shadow:0 0 40px rgba(251,191,36,.45),0 2px 8px rgba(0,0,0,.9);line-height:1}
.hdr-year{display:flex;align-items:center;gap:.65rem}
.hdr-year::before,.hdr-year::after{content:'';display:block;height:1px;width:2.5rem;background:linear-gradient(to right,transparent,var(--gold-dim))}
.hdr-year::after{background:linear-gradient(to left,transparent,var(--gold-dim))}
.hdr-year span{font-family:'Oswald',sans-serif;color:var(--gold-dim);letter-spacing:.4em;font-size:.8rem}

/* ── TABS ── */
.tabs{display:flex;justify-content:center;gap:.4rem;padding:.65rem 1rem;flex-wrap:wrap}
.tab{padding:.45rem 1rem;border-radius:9999px;border:1px solid var(--border);background:transparent;
  color:var(--dim);font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.05em;
  cursor:pointer;transition:all .2s;-webkit-appearance:none}
.tab:hover{border-color:#444;color:var(--mid)}
.tab.active{background:var(--gold);color:#000;border-color:#fcd34d;box-shadow:0 0 18px rgba(251,191,36,.3)}

/* ── CONTENT ── */
#content{max-width:640px;margin:0 auto;padding:0 1rem 5rem}
.sec-label{font-family:'Oswald',sans-serif;font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;
  color:var(--gold-dim);text-align:center;margin-bottom:1.1rem}

/* ── HOME ── */
.home-hero{text-align:center;padding:1.25rem 0 .5rem;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.home-trophy{font-size:3.2rem}
.home-big{font-family:'Bebas Neue',cursive;font-size:2.2rem;color:var(--gold);letter-spacing:.05em;
  text-shadow:0 0 28px rgba(251,191,36,.3)}
.home-date{color:var(--dim);font-size:.83rem}
.dupla-list{display:flex;flex-direction:column;gap:.45rem;margin:1.25rem 0}
.dupla-card{display:flex;align-items:center;gap:.7rem;background:var(--bg3);border:1px solid var(--border);
  border-radius:.85rem;padding:.7rem .9rem}
.d-flag{font-size:1.5rem;width:1.9rem;text-align:center}
.d-info{flex:1}
.d-name{font-family:'Oswald',sans-serif;font-size:.95rem;font-weight:600;color:#fff}
.d-sub{font-size:.68rem;color:var(--dim);margin-top:.1rem}
.d-num{width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--gold-dim);background:rgba(251,191,36,.06);
  display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--gold);font-weight:700}
.prize-card{background:linear-gradient(135deg,#1c0d00,#111);border:1px solid var(--gold-dim);border-radius:1rem;
  padding:1.35rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.4rem;
  box-shadow:0 0 28px rgba(217,119,6,.12);margin:1.25rem 0}
.prize-icon{font-size:1.9rem}
.prize-lbl{font-family:'Bebas Neue',cursive;color:var(--gold);font-size:1.3rem;letter-spacing:.06em}
.prize-amt{font-family:'Bebas Neue',cursive;color:#fff;font-size:2.4rem;letter-spacing:.03em}
.prize-sub{color:var(--dim);font-size:.76rem}
.roul-note{text-align:center;color:var(--dim);font-size:.76rem;line-height:1.55;padding:0 .5rem}
.roul-note span{color:var(--gold);font-weight:600}

/* ── PLACAR ── */
.placar-wrap{display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding-top:1.1rem}
.win-banner{font-family:'Bebas Neue',cursive;font-size:1.4rem;color:var(--gold);letter-spacing:.04em;
  text-align:center;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;width:100%}
.score-card{background:var(--bg3);border:2px solid var(--border);border-radius:1rem;padding:1rem .65rem;
  display:flex;flex-direction:column;align-items:center;gap:.65rem;transition:border-color .3s,box-shadow .3s}
.score-card.flash{border-color:var(--gold);box-shadow:0 0 22px rgba(251,191,36,.28)}
.score-name{font-family:'Oswald',sans-serif;font-size:.88rem;font-weight:600;color:#FBBF24;
  text-align:center;border-bottom:1px dashed var(--gold-faint);cursor:pointer;padding-bottom:2px;
  transition:color .2s;word-break:break-word;max-width:100%}
.score-name:hover{color:#FDE68A;border-color:var(--gold)}
.score-inp{font-family:'Oswald',sans-serif;font-size:.88rem;font-weight:600;color:#FBBF24;
  background:transparent;border:none;border-bottom:2px solid var(--gold);outline:none;text-align:center;width:100%;max-width:9rem}
.score-num{font-family:'Bebas Neue',cursive;font-size:4.2rem;color:var(--gold);line-height:1;user-select:none}
.pips{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.pip{width:13px;height:13px;border-radius:3px;border:1px solid;transition:all .2s}
.pip.on{background:var(--gold);border-color:#FDE68A;box-shadow:0 0 5px rgba(251,191,36,.45)}
.pip.off{background:#1a1a1a;border-color:#282828}
.score-btns{display:flex;gap:.55rem}
.btn-sc{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid;font-size:1.35rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;
  user-select:none;-webkit-user-select:none}
.btn-sc:active{transform:scale(.86)}
.btn-m{background:#1c0505;border-color:#7f1d1d;color:#fca5a5}
.btn-p{background:#1c1000;border-color:var(--gold-dim);color:#FDE68A}

/* ── CHAVEAMENTO ── */
.chave-wrap{display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding-top:1.1rem}
.btn-sort{padding:.65rem 1.6rem;border-radius:9999px;font-family:'Oswald',sans-serif;
  letter-spacing:.08em;font-size:.85rem;font-weight:600;cursor:pointer;border:2px solid var(--gold-dim);
  background:transparent;color:var(--gold);transition:all .2s;-webkit-appearance:none}
.btn-sort:hover{background:rgba(251,191,36,.07)}
.btn-sort:disabled{opacity:.5;cursor:default}
.btn-sort.done{border-color:#166534;color:#4ade80}
.btn-sort.spin{animation:pulse .7s infinite}
.btn-refazer{background:transparent;border:none;color:#374151;font-size:.7rem;text-decoration:underline;cursor:pointer;padding:0}
.bracket-scroll{width:100%;overflow-x:auto;padding-bottom:.5rem;-webkit-overflow-scrolling:touch}
.bracket{display:flex;gap:0;align-items:flex-start;justify-content:center;min-width:max-content;padding:0 .25rem}
.b-col{display:flex;flex-direction:column;gap:.65rem;padding-top:.5rem}
.b-col-title{font-family:'Oswald',sans-serif;font-size:.62rem;text-transform:uppercase;letter-spacing:.18em;
  text-align:center;margin-bottom:.2rem;color:#4b5563}
.b-col-title.gold{color:var(--gold-dim)}
.b-div{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 .15rem;margin-top:2.2rem}
.b-div .ln{width:1px;height:4.5rem;background:#252525}
.b-div .ar{color:#374151;font-size:1.1rem;line-height:1}
.m-wrap{display:flex;flex-direction:column;gap:.2rem}
.m-lbl{font-family:'Oswald',sans-serif;font-size:.62rem;text-transform:uppercase;letter-spacing:.13em;color:#4b5563}
.m-lbl.gold{color:var(--gold-dim)}
.m-sub{font-size:.58rem;color:#2d2d2d;font-style:italic}
.match{border:2px solid var(--border);border-radius:.7rem;background:#0f0f0f;overflow:hidden;
  width:10.5rem;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.match.gld{border-color:var(--gold-dim)}
.m-team{display:flex;align-items:center;gap:.45rem;padding:.5rem .65rem;transition:background .15s;
  border-bottom:1px solid #1a1a1a}
.m-team:last-child{border-bottom:none}
.m-team.can{cursor:pointer}
.m-team.can:hover{background:rgba(255,255,255,.04)}
.m-team.can:active{background:rgba(255,255,255,.07)}
.m-team.win{background:rgba(251,191,36,.1)}
.m-team.elim{opacity:.2}
.m-tname{font-family:'Oswald',sans-serif;font-size:.77rem;font-weight:600;color:#e5e7eb;
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-tname.w{color:var(--gold)}
.m-tname.em{color:#2d2d2d;font-style:italic;font-size:.68rem;font-weight:400;font-family:'Inter',sans-serif}
.m-hint{font-size:.58rem;color:#2d2d2d;margin-top:.12rem}
.podium{display:flex;gap:1.25rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}
.pod-item{display:flex;flex-direction:column;align-items:center;gap:.2rem;text-align:center}
.pod-icon{font-size:2.5rem}
.pod-name{font-family:'Bebas Neue',cursive;font-size:1.15rem;color:var(--gold);
  letter-spacing:.04em;max-width:9rem;word-break:break-word}
.pod-name.t3{color:#d1d5db}
.pod-lbl{font-family:'Oswald',sans-serif;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim)}
.pod-lbl.t3{color:#374151}
.chave-hint{font-size:.73rem;color:#374151;text-align:center;max-width:20rem;line-height:1.5}
.btn-rst{padding:.45rem 1.4rem;border-radius:9999px;border:1px solid #252525;background:transparent;
  color:#374151;font-size:.76rem;cursor:pointer;transition:all .2s;-webkit-appearance:none}
.btn-rst:hover{background:#1a1a1a;color:var(--dim)}
.sp{height:.5rem}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-fire">🔥</div>
    <div class="hdr-title">BINHO HOUSE CUP</div>
    <div class="hdr-year"><span>2026</span></div>
    <div class="hdr-fire">🔥</div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="content"></div>
</div>

<script>
const DB=[
  {flag:"🇪🇸",name:"Marinho / Binho"},
  {flag:"🇸🇪",name:"Enzo / Samuel"},
  {flag:"🇵🇹",name:"Amorim / Pedro"},
  {flag:"🇧🇷",name:"Davi / Gonzales"}
];

let S={
  tab:"home",
  sc:[0,0],
  sn:[DB[0].flag+" "+DB[0].name, DB[2].flag+" "+DB[2].name],
  editSc:null, flashSc:null,
  dp:DB.map(d=>d.flag+" "+d.name),
  sorted:false, spinning:false,
  r1a:null,r1b:null,r2w:null,r2l:null,ch:null,th:null
};

const TABS=[
  {k:"home",l:"🏆 Início"},
  {k:"placar",l:"🃏 Placar"},
  {k:"chaveamento",l:"⚔️ Chaveamento"}
];

const g=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const loser=(a,b,w)=>!w?null:w===a?b:a;
const L1a=()=>loser(S.dp[0],S.dp[1],S.r1a);
const L1b=()=>loser(S.dp[2],S.dp[3],S.r1b);
const Lr2w=()=>loser(S.r1a,S.r1b,S.r2w);
const Lr2l=()=>loser(L1a(),L1b(),S.r2l);

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  g("tabs").innerHTML=TABS.map(t=>`<button class="tab${S.tab===t.k?' active':''}" onclick="setTab('${t.k}')">${t.l}</button>`).join("");
  const views={home:vHome,placar:vPlacar,chaveamento:vChave};
  g("content").innerHTML=views[S.tab]();
  if(S.tab==="placar"&&S.editSc!==null){const i=g("sci");if(i){i.focus();i.select();}}
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function vHome(){
  return`<div class="home-hero"><div class="home-trophy">🏆</div>
    <div class="home-big">BINHO HOUSE CUP</div>
    <div class="home-date">📅 Sexta-feira, 30 de Maio de 2026</div></div>
  <p class="sec-label" style="margin-top:1.25rem">♣️ Jogadores &amp; Seleções ♦️</p>
  <div class="dupla-list">${DB.map((d,i)=>`
    <div class="dupla-card"><div class="d-flag">${d.flag}</div>
    <div class="d-info"><div class="d-name">${esc(d.name)}</div><div class="d-sub">Dupla ${i+1}</div></div>
    <div class="d-num">${i+1}</div></div>`).join("")}</div>
  <div class="prize-card"><div class="prize-icon">💰</div>
    <div class="prize-lbl">PREMIAÇÃO</div>
    <div class="prize-amt">R$ 240,00</div>
    <div class="prize-sub">Dupla Campeã leva tudo 💸</div></div>
  <p class="roul-note">🃏 Confrontos definidos na hora pela <span>Roleta</span> — use o chaveamento para registrar os resultados</p>`;
}

// ── PLACAR ────────────────────────────────────────────────────────────────────
function vPlacar(){
  const w=S.sc[0]===12?0:S.sc[1]===12?1:null;
  const banner=w!==null?`<div class="win-banner">🔥 ${esc(S.sn[w])} VENCEU! 🔥</div>`:"";
  const cards=[0,1].map(i=>{
    const s=S.sc[i];
    const pips=Array.from({length:12},(_,j)=>`<div class="pip ${j<s?'on':'off'}"></div>`).join("");
    const nm=S.editSc===i
      ?`<input id="sci" class="score-inp" type="text" value="${esc(S.sn[i])}" maxlength="22"
          onblur="commitName(${i})" onkeydown="if(event.key==='Enter')this.blur()">`
      :`<div class="score-name" onclick="editName(${i})">${esc(S.sn[i])}</div>`;
    return`<div class="score-card${S.flashSc===i?' flash':''}">
      ${nm}
      <div class="score-num">${s}</div>
      <div class="pips">${pips}</div>
      <div class="score-btns">
        <div class="btn-sc btn-m" onclick="chSc(${i},-1)">−</div>
        <div class="btn-sc btn-p" onclick="chSc(${i},1)">+</div>
      </div></div>`;
  }).join("");
  return`<div class="placar-wrap">
    <p class="sec-label">✦ Placar da Partida ✦</p>
    ${banner}
    <div class="score-grid">${cards}</div>
    <button class="btn-rst" onclick="rstSc()">↺ Reiniciar Placar</button>
  </div>`;
}

// ── CHAVEAMENTO ───────────────────────────────────────────────────────────────
function mCard(label,sub,tA,tB,win,fnName,gold){
  const can=t=>t&&!win&&tA&&tB;
  const row=(t,top)=>{
    const isW=win&&win===t, isE=win&&win!==t;
    let cls="m-team"+(can(t)?" can":"")+(isW?" win":"")+(isE?" elim":"");
    const da=can(t)?`data-fn="${fnName}" data-team="${esc(t)}" onclick="mClick(this)"`:"";
    const tnc="m-tname"+(isW?" w":"")+(t?"":" em");
    const tr=isW?`<span style="font-size:.7rem">🏆</span>`:"";
    return`<div class="${cls}" ${da}>${tr}<span class="${tnc}">${t?esc(t):"aguardando..."}</span></div>`;
  };
  const hint=(!win&&tA&&tB)?`<div class="m-hint">↑ clique no vencedor</div>`:"";
  return`<div class="m-wrap">
    ${label?`<div class="m-lbl${gold?' gold':''}">${label}</div>`:""}
    ${sub?`<div class="m-sub">${sub}</div>`:""}
    <div class="match${gold?' gld':''}">${row(tA,1)}${row(tB,0)}</div>
    ${hint}</div>`;
}

function vChave(){
  const l1a=L1a(),l1b=L1b(),lr2w=Lr2w(),lr2l=Lr2l();
  const sortBtn=S.sorted
    ?`<div style="display:flex;flex-direction:column;align-items:center;gap:.3rem">
        <button class="btn-sort done" disabled>✓ SORTEIO REALIZADO</button>
        <button class="btn-refazer" onclick="refazer()">refazer sorteio</button></div>`
    :S.spinning
    ?`<button class="btn-sort spin" disabled>🎲 SORTEANDO...</button>`
    :`<button class="btn-sort" onclick="sortear()">🎲 SORTEAR CHAVEAMENTO</button>`;

  const m1a=mCard("Jogo A","vencedores →",S.dp[0],S.dp[1],S.r1a,"wR1a",0);
  const m1b=mCard("Jogo B","vencedores →",S.dp[2],S.dp[3],S.r1b,"wR1b",0);
  const m2w=mCard("Semi vencedores","",S.r1a,S.r1b,S.r2w,"wR2w",0);
  const m2l=mCard("Semi perdedores","",l1a,l1b,S.r2l,"wR2l",0);
  const mF=mCard("🏆 Grande Final","",S.r2w,S.r2l,S.ch,"wCh",1);
  const m3=mCard("🥉 3º e 4º lugar","",lr2w,lr2l,S.th,"wTh",0);

  const podium=(S.ch||S.th)?`<div class="podium">
    ${S.ch?`<div class="pod-item"><div class="pod-icon">🏆</div>
      <div class="pod-name">${esc(S.ch)}</div>
      <div class="pod-lbl">Campeão · R$240</div></div>`:""}
    ${S.th?`<div class="pod-item"><div class="pod-icon">🥉</div>
      <div class="pod-name t3">${esc(S.th)}</div>
      <div class="pod-lbl t3">3º Lugar</div></div>`:""}
  </div>`:"";

  return`<div class="chave-wrap">
    <p class="sec-label">✦ Chaveamento do Campeonato ✦</p>
    ${sortBtn}
    <div class="bracket-scroll"><div class="bracket">
      <div class="b-col">
        <div class="b-col-title">Rodada 1</div>
        ${m1a}<div class="sp"></div>${m1b}
      </div>
      <div class="b-div"><div class="ln"></div><div class="ar">›</div><div class="ln"></div></div>
      <div class="b-col">
        <div class="b-col-title">Rodada 2</div>
        ${m2w}<div class="sp"></div>${m2l}
      </div>
      <div class="b-div"><div class="ln"></div><div class="ar">›</div><div class="ln"></div></div>
      <div class="b-col">
        <div class="b-col-title gold">Finais</div>
        ${mF}<div class="sp"></div>${m3}
      </div>
    </div></div>
    <p class="chave-hint">Quem perde na Rodada 1 ainda disputa a semi dos perdedores e pode chegar à final 🔥</p>
    ${podium}
    <button class="btn-rst" onclick="rstChave()">↺ Reiniciar Chaveamento</button>
  </div>`;
}

// ── HANDLERS ─────────────────────────────────────────────────────────────────
function setTab(t){S.tab=t;S.editSc=null;render();}

function chSc(i,d){
  S.sc[i]=Math.max(0,S.sc[i]+d);
  if(S.sc[i]>12)S.sc[i]=0;
  if(d>0){S.flashSc=i;render();setTimeout(()=>{S.flashSc=null;render();},500);}
  else render();
}
function editName(i){S.editSc=i;render();}
function commitName(i){const el=g("sci");if(el){const v=el.value.trim();if(v)S.sn[i]=v;}S.editSc=null;render();}
function rstSc(){S.sc=[0,0];render();}

function mClick(el){const fn=el.dataset.fn,t=el.dataset.team;window[fn](t);}
function rstB(){S.r1a=null;S.r1b=null;S.r2w=null;S.r2l=null;S.ch=null;S.th=null;}
function rstChave(){rstB();render();}
function sortear(){S.spinning=true;render();setTimeout(()=>{S.dp=shuffle(DB.map(d=>d.flag+" "+d.name));S.spinning=false;S.sorted=true;rstB();render();},1400);}
function refazer(){S.sorted=false;S.dp=DB.map(d=>d.flag+" "+d.name);rstB();render();}
function wR1a(w){S.r1a=w;S.r2w=null;S.r2l=null;S.ch=null;S.th=null;render();}
function wR1b(w){S.r1b=w;S.r2w=null;S.r2l=null;S.ch=null;S.th=null;render();}
function wR2w(w){S.r2w=w;S.ch=null;S.th=null;render();}
function wR2l(w){S.r2l=w;S.ch=null;S.th=null;render();}
function wCh(w){S.ch=w;render();}
function wTh(w){S.th=w;render();}

render();
</script>
</body>
</html>
